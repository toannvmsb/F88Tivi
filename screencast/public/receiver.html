<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F88Tivi - Màn hình nhận</title>
<link rel="icon" href="/favicon.png" type="image/png">
<style>
  html, body { margin:0; height:100%; background:#000; color:#fff; font-family: Montserrat, "Open Sans", Roboto, Arial, sans-serif; overflow:hidden; }
  video { position:fixed; inset:0; width:100%; height:100%; object-fit:contain; background:#000; display:none; }
  #idle { position:fixed; inset:0; display:flex; flex-direction:row; align-items:center; justify-content:center; gap:5vw; background:linear-gradient(135deg, #18745C, #1C5658); text-align:center; padding:24px; box-sizing:border-box; }
  #main { display:flex; flex-direction:column; align-items:center; justify-content:center; }
  #logo { height:6vw; max-height:100px; margin-bottom:1.5vw; }
  #idle h1 { font-size:2.6vw; margin:0 0 .6vw; font-weight:500; color:#d6eadf; }
  #code { font-size:9vw; font-weight:800; letter-spacing:1vw; line-height:1; }
  #qr { background:#fff; padding:12px; border-radius:16px; margin-top:2vw; }
  #qr svg, #qr img { display:block; width:13vw; height:13vw; min-width:140px; min-height:140px; }
  #url { margin-top:1.6vw; font-size:2.8vw; font-weight:700; color:#fff; word-break:break-all; }
  #status { margin-top:1vw; font-size:1.5vw; color:#62E222; font-weight:600; min-height:1.6em; }
  button { font-family: inherit; cursor:pointer; }
  #renew { margin-top:1.4vw; font:600 1.4vw/1 Montserrat, "Open Sans", Roboto, Arial, sans-serif; color:#fff; background:#ffffff1f; border:2px solid #ffffff80; border-radius:40px; padding:.8vw 2vw; }
  #renew:hover, #renew:focus { background:#62E222; color:#0b2e22; border-color:#62E222; outline:none; }

  /* Khi có người trong phòng: thu nhỏ khối mã ở bên trái, hiện danh sách bên phải */
  #panel { display:none; width:42vw; max-height:84vh; text-align:left; }
  #idle.has #panel { display:block; }
  #idle.has #logo { height:4vw; margin-bottom:1vw; }
  #idle.has h1 { font-size:1.7vw; }
  #idle.has #code { font-size:5.5vw; }
  #idle.has #qr { margin-top:1.2vw; padding:8px; }
  #idle.has #qr svg, #idle.has #qr img { width:9vw; height:9vw; min-width:110px; min-height:110px; }
  #idle.has #url { font-size:2vw; margin-top:1vw; }
  #idle.has #status { font-size:1.3vw; }
  #idle.has #renew { font-size:1.2vw; }
  #panel h2 { margin:0 0 1vw; font-size:2.2vw; font-weight:700; }
  #panel .sub { margin:0 0 1.2vw; font-size:1.3vw; color:#d6eadf; }
  #list { max-height:62vh; overflow-y:auto; padding:6px 6px 2px; margin:-6px -6px 0; }
  .row { display:flex; align-items:center; gap:1vw; background:#ffffff1f; border-radius:16px; padding:.9vw 1.2vw; margin-bottom:.9vw; }
  .row .name { flex:1; font-size:2.1vw; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row button { font-weight:700; border-radius:30px; border:2px solid transparent; padding:.7vw 1.6vw; font-size:1.5vw; }
  .row .pick { background:#62E222; color:#0b2e22; }
  .row .kick { background:transparent; color:#fff; border-color:#ffffff80; font-size:1.2vw; }
  .row button:focus { outline:none; box-shadow:0 0 0 4px #fff; transform:scale(1.04); }

  #hint { position:fixed; left:50%; bottom:5%; transform:translateX(-50%); background:#000b; padding:12px 22px; border-radius:30px; font-size:20px; display:none; z-index:5; }
  #bar { position:fixed; left:50%; top:4%; transform:translateX(-50%); background:#000c; padding:12px 14px 12px 26px; border-radius:40px; display:none; align-items:center; gap:18px; font-size:24px; z-index:6; }
  #bar button { background:#e5484d; color:#fff; border:2px solid transparent; border-radius:30px; padding:10px 24px; font-size:22px; font-weight:700; }
  #bar button:focus { outline:none; box-shadow:0 0 0 4px #fff; }
</style>
</head>
<body>
<video id="video" autoplay playsinline></video>
<div id="idle">
  <div id="main">
    <img id="logo" src="/logo-white.png" alt="F88Tivi">
    <h1>Nhập mã này trên máy cần chiếu</h1>
    <div id="code">------</div>
    <div id="qr"></div>
    <div id="url"></div>
    <div id="status">Đang kết nối máy chủ…</div>
    <button id="renew" type="button">Tạo mã mới</button>
  </div>
  <div id="panel">
    <h2 id="ptitle">Người trong phòng</h2>
    <p class="sub">Dùng phím mũi tên và OK trên remote để chọn người chiếu.</p>
    <div id="list"></div>
  </div>
</div>
<div id="hint"></div>
<div id="bar"><span id="who"></span><button id="stopbtn" type="button">Dừng chiếu</button></div>
<script src="/vendor/qrcode.js"></script>
<script src="/config.js"></script>
<script>
let ICE_SERVERS = window.SC_CONFIG.ICE_SERVERS; // server có thể gửi danh sách khác (kèm TURN) khi đăng ký
scWake();
const $ = (id) => document.getElementById(id);
const video = $('video');
let ws, pc, pending = [], retry = 0, hintTimer, barTimer;
let roster = [], activeId = null, prevCount = 0;

function showHint(t, ms = 6000) {
  const h = $('hint'); h.textContent = t; h.style.display = 'block';
  clearTimeout(hintTimer); hintTimer = setTimeout(() => (h.style.display = 'none'), ms);
}
function setStatus(t) { $('status').textContent = t; }
function showVideo(on) {
  video.style.display = on ? 'block' : 'none'; $('idle').style.display = on ? 'none' : 'flex';
  if (!on) hideBar();
}
const playing = () => video.style.display === 'block';

function drawQR(code) {
  const url = `${location.origin}/sender.html?code=${code}`;
  try {
    const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
    $('qr').style.display = '';
    $('qr').innerHTML = qr.createSvgTag({ cellSize: 6, margin: 0, scalable: true });
  } catch (e) { $('qr').style.display = 'none'; }
  $('url').textContent = location.origin;
}

function closePeer() {
  if (pc) { pc.ontrack = pc.onicecandidate = pc.onconnectionstatechange = null; pc.close(); pc = null; }
  pending = [];
  video.srcObject = null;
  showVideo(false);
}

async function startPlayback() {
  video.muted = false;
  try { await video.play(); }
  catch {
    video.muted = true;
    try { await video.play(); } catch {}
    showHint('Bấm OK / chạm màn hình để bật tiếng', 15000);
  }
}

function newPeer() {
  closePeer();
  pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
  pc.onicecandidate = (e) => { if (e.candidate) ws.send(JSON.stringify({ type: 'signal', data: { candidate: e.candidate } })); };
  pc.ontrack = (e) => {
    if (video.srcObject !== e.streams[0]) { video.srcObject = e.streams[0]; showVideo(true); startPlayback(); }
    try { e.receiver.jitterBufferTarget = 0; } catch {}      // giảm độ trễ
    try { e.receiver.playoutDelayHint = 0; } catch {}
  };
  pc.onconnectionstatechange = () => {
    if (!pc) return;
    if (pc.connectionState === 'failed' || pc.connectionState === 'closed') {
      closePeer(); setStatus('Mất kết nối. Chọn lại người chiếu.');
      if (activeId && ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'stop' }));
    }
  };
}

async function onSignal(d) {
  if (d.sdp) {
    newPeer();
    await pc.setRemoteDescription(d.sdp);
    for (const c of pending) await pc.addIceCandidate(c).catch(() => {});
    pending = [];
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    ws.send(JSON.stringify({ type: 'signal', data: { sdp: pc.localDescription } }));
  } else if (d.candidate) {
    if (pc && pc.remoteDescription) await pc.addIceCandidate(d.candidate).catch(() => {});
    else pending.push(d.candidate);
  }
}

// ---- Danh sách người trong phòng ----
function renderList() {
  const list = $('list');
  const hadFocus = list.contains(document.activeElement);
  const idx = hadFocus ? [...list.querySelectorAll('.row')].findIndex((r) => r.contains(document.activeElement)) : -1;
  list.textContent = '';
  for (const p of roster) {
    const row = document.createElement('div'); row.className = 'row';
    const name = document.createElement('span'); name.className = 'name'; name.textContent = p.name;
    const pick = document.createElement('button'); pick.type = 'button'; pick.className = 'pick'; pick.textContent = 'Chiếu';
    pick.onclick = () => ws.send(JSON.stringify({ type: 'select', id: p.id }));
    const kick = document.createElement('button'); kick.type = 'button'; kick.className = 'kick'; kick.textContent = 'Mời ra';
    kick.onclick = () => ws.send(JSON.stringify({ type: 'kick', id: p.id }));
    row.append(name, pick, kick); list.append(row);
  }
  $('ptitle').textContent = `Người trong phòng (${roster.length})`;
  const wasHas = $('idle').classList.contains('has');
  $('idle').classList.toggle('has', roster.length > 0);
  const rows = list.querySelectorAll('.row');
  if (rows.length && (!wasHas || hadFocus || document.activeElement === document.body)) {
    const r = rows[Math.min(Math.max(idx, 0), rows.length - 1)];
    const b = r.querySelector('.pick'); if (b) b.focus();
  }
}

function onRoster(m) {
  const list = m.list || [];
  const prevActive = activeId;
  activeId = m.active || null;
  if (prevActive && !activeId) closePeer();                 // người đang chiếu dừng → quay lại danh sách
  if (prevCount > 0 && list.length === 0) { renewCode(); return; }   // phòng trống sau khi có người → tạo mã mới
  prevCount = list.length; roster = list; renderList();
  if (activeId && activeId !== prevActive) {
    const w = list.find((x) => x.id === activeId);
    showHint('Đang chiếu: ' + (w ? w.name : ''), 5000);
    setStatus('Đang kết nối với ' + (w ? w.name : '') + '…');
  }
  if (!activeId) setStatus(list.length ? 'Chọn người cần chiếu.' : 'Sẵn sàng. Đang chờ máy chiếu…');
  $('who').textContent = (list.find((x) => x.id === activeId) || {}).name ? 'Đang chiếu: ' + list.find((x) => x.id === activeId).name : '';
}

function connect() {
  ws = new WebSocket(scWsUrl());
  ws.onopen = () => {
    retry = 0; roster = []; activeId = null; prevCount = 0; renderList();
    ws.send(JSON.stringify({ type: 'register', code: localStorage.getItem('sc_code') || undefined }));
  };
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === 'registered') {
      if (m.iceServers) ICE_SERVERS = m.iceServers;
      localStorage.setItem('sc_code', m.code);
      $('code').textContent = m.code; drawQR(m.code);
      setStatus('Sẵn sàng. Đang chờ máy chiếu…');
    } else if (m.type === 'roster') onRoster(m);
    else if (m.type === 'signal') onSignal(m.data).catch((e) => console.error(e));
  };
  ws.onclose = () => {
    closePeer();
    setStatus('Mất kết nối máy chủ, đang thử lại…');
    setTimeout(connect, Math.min(1000 * ++retry, 5000));
  };
}

// Tạo mã mới: bỏ mã đã lưu rồi đăng ký lại, server sẽ cấp mã khác (mã cũ hết hiệu lực, mọi người trong phòng bị ngắt).
function renewCode() {
  try { localStorage.removeItem('sc_code'); } catch {}
  closePeer();
  roster = []; activeId = null; prevCount = 0; renderList();
  $('code').textContent = '------'; $('qr').innerHTML = ''; $('qr').style.display = 'none';
  setStatus('Đang tạo mã mới…');
  if (ws) { ws.onclose = null; ws.onmessage = null; try { ws.close(); } catch {} }
  retry = 0;
  connect();
}
$('renew').addEventListener('click', renewCode);

// ---- Thanh "Dừng chiếu" khi đang xem ----
function showBar() {
  $('bar').style.display = 'flex'; $('stopbtn').focus();
  clearTimeout(barTimer); barTimer = setTimeout(hideBar, 10000);
}
function hideBar() { clearTimeout(barTimer); $('bar').style.display = 'none'; if (document.activeElement === $('stopbtn')) $('stopbtn').blur(); }
$('stopbtn').addEventListener('click', () => { hideBar(); if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'stop' })); });

function interact() {
  if (video.srcObject) { video.muted = false; video.play().catch(() => {}); $('hint').style.display = 'none'; }
  if (!document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
}
addEventListener('click', (e) => { interact(); if (playing() && e.target !== $('stopbtn')) showBar(); });

// Điều hướng bằng phím mũi tên trên remote: danh sách (mỗi hàng: Chiếu | Mời ra), nút "Tạo mã mới".
function moveFocus(k) {
  const rows = [...document.querySelectorAll('#list .row')].map((r) => [...r.querySelectorAll('button')]);
  const cur = document.activeElement, ren = $('renew');
  if (!rows.length) { ren.focus(); return; }
  if (cur === ren) { if (k !== 'ArrowLeft') rows[0][0].focus(); return; }
  let r = -1, c = -1;
  rows.forEach((row, i) => { const j = row.indexOf(cur); if (j >= 0) { r = i; c = j; } });
  if (r < 0) { rows[0][0].focus(); return; }
  if (k === 'ArrowDown') r = Math.min(r + 1, rows.length - 1);
  else if (k === 'ArrowUp') r = Math.max(r - 1, 0);
  else if (k === 'ArrowRight') c = Math.min(c + 1, rows[r].length - 1);
  else if (k === 'ArrowLeft') { if (c === 0) { ren.focus(); return; } c--; }
  rows[r][Math.min(c, rows[r].length - 1)].focus();
}
addEventListener('keydown', (e) => {
  if (playing()) {
    if (e.key === ' ') return;
    if (e.target === $('stopbtn')) { clearTimeout(barTimer); barTimer = setTimeout(hideBar, 10000); return; }
    e.preventDefault();       // chặn "OK" kích hoạt luôn nút vừa hiện ra
    interact(); showBar();
    return;
  }
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) { e.preventDefault(); moveFocus(e.key); }
});
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible') try { await navigator.wakeLock.request('screen'); } catch {}
});
try { navigator.wakeLock.request('screen').catch(() => {}); } catch {}

connect();
</script>
</body>
</html>
